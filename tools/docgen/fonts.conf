<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  PDF生成用のフォント解決ルール（docx→PDF変換で LibreOffice が読む）。

  ■ なぜこのファイルが必要か
  Word文書（docx）は本文に "MS Mincho"・見出しに "MS Gothic" を指定している
  （tools/docgen/md2docx.js の BODY_FONT / HEAD_FONT）。これらはWindows用のフォントで
  Linuxには存在しないため、指示しないとLibreOfficeが勝手に代替フォントを選ぶ。
  実際に、この設定が無い環境では日本語本文が中国語フォント（WenQuanYi Zen Hei）に
  落ち、日本語と字形が異なる漢字で法務文書のPDFが出力された（2026-07-29）。
  弁護士へ提出する資料としては不適切なため、対応を明示的に固定する。

  ■ 以前は環境依存だった
  当初この設定は /root/.config/fontconfig/fonts.conf に手で置いていたが、
  コンテナを作り直すと消えるためリポジトリへ移した。
  build-legal.js / build-manual.js が FONTCONFIG_FILE でこのファイルを渡す。

  ■ 必要なフォントパッケージ
  fonts-ipafont-mincho ／ fonts-ipafont-gothic ／ fonts-wqy-zenhei の3つ。
  導入コマンドは tools/docgen/pdf-fonts.js のエラーメッセージが表示する。
  どれかが欠けていればビルドが止まる（スクリプト側で検査している）。

  ■ 編集時の注意
  XMLのコメントの中に半角ハイフン2つを続けて書くと構文エラーになる。
  fontconfig は読み込みに失敗しても処理を続けてしまい、
  「設定が無いのと同じ」状態で静かにPDFが出来上がる。
  そのため pdf-fonts.js 側で、別名解決が実際に効いているかを検査している。
-->
<fontconfig>
  <!-- まず標準の設定を読み込む。FONTCONFIG_FILE は設定を「置き換える」ため、
       これを省くとシステムのフォント一覧そのものが見えなくなる。 -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- MS明朝 → IPA P明朝（プロポーショナル明朝） -->
  <match target="pattern">
    <test name="family"><string>MS Mincho</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IPAPMincho</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS 明朝</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IPAPMincho</string></edit>
  </match>

  <!-- MSゴシック → IPAゴシック（等幅ゴシック。表や見出しの字幅を揃えるため P でない方） -->
  <match target="pattern">
    <test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IPAGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS ゴシック</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IPAGothic</string></edit>
  </match>

  <!-- 簡体字のフォールバック。
       サービス名「樱聘」の 樱 はIPAフォントに含まれないため、
       これが無いと表紙のサービス名が豆腐（□）になる。
       IPAの後ろに置くので、日本語の字形はIPAが優先される。 -->
  <match target="pattern">
    <test name="family"><string>IPAPMincho</string></test>
    <edit name="family" mode="append" binding="weak"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>IPAGothic</string></test>
    <edit name="family" mode="append" binding="weak"><string>WenQuanYi Zen Hei</string></edit>
  </match>
</fontconfig>
